<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - NUMARQO ECOSYSTEM</title>
    <meta name="theme-color" content="#0B1F44">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: radial-gradient(circle at center, #1e3a8a 0%, #0B1F44 100%); color: #0B1F44; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .numarqo-navbar { width: 100%; background: rgba(11, 31, 68, 0.85); backdrop-filter: blur(12px); color: #FFFFFF; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 25px rgba(0,0,0,0.3); }
        .numarqo-logo-wrap { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .numarqo-emblem { width: 38px; height: 38px; background: #0B1F44; border-radius: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .n-bar-1 { position: absolute; width: 13px; height: 100%; background: #2563EB; left: 4px; transform: skewX(-15deg); }
        .n-bar-2 { position: absolute; width: 13px; height: 100%; background: #06B6D4; right: 4px; transform: skewX(-15deg); }
        .numarqo-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
        .numarqo-sub { font-size: 0.65rem; font-weight: 700; color: #06B6D4; letter-spacing: 0.15em; text-transform: uppercase; }
        .nav-link { color: #CBD5E1; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .nav-link:hover { color: #FFFFFF; }
        .container { max-width: 540px; width: 92%; margin: 28px auto; padding: 28px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.6); text-align: left; position: relative; }
        h1 { font-size: 1.4rem; font-weight: 800; color: #0B1F44; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
        .subtitle { font-size: 0.85rem; color: #64748B; margin-bottom: 20px; line-height: 1.4; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-group label { font-size: 0.82rem; font-weight: 700; color: #1E293B; }
        .form-input, .form-textarea { padding: 12px 14px; border-radius: 12px; border: 1px solid #CBD5E1; font-size: 0.9rem; background: #F8FAFC; color: #0B1F44; outline: none; }
        .form-textarea { resize: vertical; min-height: 100px; }
        .form-input:focus, .form-textarea:focus { border-color: #2563EB; background: #FFF; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .numarqo-btn { padding: 12px 20px; background: #2563EB; color: #FFF; border: none; border-radius: 14px; font-weight: 700; font-size: 0.9rem; cursor: pointer; box-shadow: 0 6px 16px rgba(37,99,235,0.3); transition: 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .numarqo-btn:hover { background: #0B1F44; }
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,31,68,0.65); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; border-radius: 28px; z-index: 20; animation: fadeIn 0.2s ease-out; }
        .modal-card { background: #ECFDF5; border: 2px solid #A7F3D0; border-radius: 24px; padding: 28px; width: 85%; max-width: 310px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-icon { font-size: 3rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.25rem; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
        .modal-msg { font-size: 0.85rem; color: #475569; margin-bottom: 18px; font-weight: 600; line-height: 1.4; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .hidden { display: none !important; }
        .footer { margin-top: 30px; font-size: 0.78rem; color: #94A3B8; text-align: center; }
    </style>
</head>
<body>
    <header class="numarqo-navbar">
        <a href="numarqo_hub.html" class="numarqo-logo-wrap">
            <div class="numarqo-emblem"><div class="n-bar-1"></div><div class="n-bar-2"></div></div>
            <div><span class="numarqo-title">Contact Support</span><span class="numarqo-sub">NUMARQO ECOSYSTEM</span></div>
        </a>
        <a href="numarqo_hub.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Kembali ke Hub</a>
    </header>
    <div class="container">
        <div id="gameModal" class="modal hidden">
            <div class="modal-card">
                <div class="modal-icon">✨</div>
                <div class="modal-title">Pesan Terkirim</div>
                <div class="modal-msg">Terima kasih! Tim dukungan Numarqo akan merespons pesan Anda dalam 24 jam.</div>
                <button class="numarqo-btn" style="width:100%; justify-content:center;" onclick="closeModal()">Mengerti</button>
            </div>
        </div>
        <h1><i class="fa-solid fa-headset" style="color:#2563EB;"></i> Hubungi Kami</h1>
        <p class="subtitle">Punya pertanyaan, masukan, atau kendala teknis? Kirimkan pesan langsung ke tim Numarqo.</p>
        
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="contactName" class="form-input" placeholder="Masukkan nama Anda">
        </div>
        <div class="form-group">
            <label>Email Profesional</label>
            <input type="email" id="contactEmail" class="form-input" placeholder="nama@domain.com">
        </div>
        <div class="form-group">
            <label>Pesan / Kendala</label>
            <textarea id="contactMsg" class="form-textarea" placeholder="Tuliskan pesan atau pertanyaan Anda di sini..."></textarea>
        </div>
        <button class="numarqo-btn" onclick="submitContact()"><i class="fa-solid fa-paper-plane"></i> Kirim Pesan</button>

        <div class="footer">&copy; 2026 Numarqo Ecosystem. All rights reserved.</div>
    </div>
    <script>
        function submitContact() {
            const name = document.getElementById('contactName').value.trim();
            const email = document.getElementById('contactEmail').value.trim();
            const msg = document.getElementById('contactMsg').value.trim();
            if (!name || !email || !msg) {
                alert('Mohon lengkapi semua kolom form.');
                return;
            }
            document.getElementById('gameModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('gameModal').classList.add('hidden');
            document.getElementById('contactName').value = '';
            document.getElementById('contactEmail').value = '';
            document.getElementById('contactMsg').value = '';
        }
    </script>
</body>
</html>
