<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Calculator Pro - NUMARQO ECOSYSTEM</title>
    <meta name="theme-color" content="#0B1F44">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: radial-gradient(circle at center, #1e3a8a 0%, #0B1F44 100%); color: #0B1F44; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* Navbar Numarqo */
        .numarqo-navbar { width: 100%; background: rgba(11, 31, 68, 0.85); backdrop-filter: blur(12px); color: #FFFFFF; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 25px rgba(0,0,0,0.3); }
        .numarqo-logo-wrap { display: flex; align-items: center; gap: 14px; }
        .numarqo-emblem { width: 38px; height: 38px; background: #0B1F44; border-radius: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .n-bar-1 { position: absolute; width: 13px; height: 100%; background: #2563EB; left: 4px; transform: skewX(-15deg); }
        .n-bar-2 { position: absolute; width: 13px; height: 100%; background: #06B6D4; right: 4px; transform: skewX(-15deg); }
        .numarqo-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
        .numarqo-sub { font-size: 0.65rem; font-weight: 700; color: #06B6D4; letter-spacing: 0.15em; text-transform: uppercase; }

        /* Kalkulator Container Pro */
        .calc-container { max-width: 460px; width: 92%; margin: 24px auto; padding: 24px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); position: relative; border: 1px solid rgba(255,255,255,0.6); }
        .calc-header { font-size: 1.35rem; font-weight: 800; color: #0B1F44; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .calc-desc { font-size: 0.82rem; color: #64748B; margin-bottom: 14px; }

        /* Mode Switcher Pills */
        .mode-pills { display: flex; gap: 8px; margin-bottom: 16px; }
        .pill-btn { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid #CBD5E1; background: #F8FAFC; color: #64748B; font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: 0.2s; }
        .pill-btn.active { background: #2563EB; color: #FFF; border-color: #2563EB; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }

        /* Display Screen */
        .display-screen { background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 16px; padding: 16px; text-align: right; margin-bottom: 16px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        #calcInput { width: 100%; border: none; background: transparent; font-size: 1.6rem; font-weight: 800; color: #0B1F44; text-align: right; outline: none; }
        #calcResult { font-size: 0.95rem; font-weight: 700; color: #2563EB; margin-top: 4px; min-height: 22px; }

        /* Keypads */
        .keypad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .calc-btn { padding: 16px; border-radius: 14px; border: 1px solid #E2E8F0; background: #FFFFFF; font-weight: 700; font-size: 1rem; color: #1E293B; cursor: pointer; transition: 0.15s; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .calc-btn:hover { background: #F1F5F9; border-color: #CBD5E1; transform: translateY(-1px); }
        .calc-btn.operator { background: #EFF6FF; color: #2563EB; border-color: #BFDBFE; }
        .calc-btn.action { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
        .calc-btn.equals { background: #2563EB; color: #FFFFFF; border-color: #1D4ED8; grid-column: span 2; }
        .calc-btn.sci { background: #F3E8FF; color: #7C3AED; border-color: #E9D5FF; font-size: 0.88rem; }

        /* AI Reasoning & History Box */
        .ai-solution-box { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 14px; padding: 14px; font-size: 0.82rem; color: #334155; text-align: left; max-height: 140px; overflow-y: auto; line-height: 1.4; display: none; margin-top: 10px; }

        /* Professional Pastel Modal */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,31,68,0.65); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; border-radius: 28px; z-index: 20; animation: fadeIn 0.2s ease-out; }
        .modal-card { background: #ECFDF5; border: 2px solid #A7F3D0; border-radius: 24px; padding: 28px; width: 85%; max-width: 310px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-icon { font-size: 3rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.25rem; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
        .modal-msg { font-size: 0.85rem; color: #475569; margin-bottom: 18px; font-weight: 600; line-height: 1.4; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="numarqo-navbar">
        <div class="numarqo-logo-wrap">
            <div class="numarqo-emblem"><div class="n-bar-1"></div><div class="n-bar-2"></div></div>
            <div><span class="numarqo-title">AI Math Calculator Pro</span><span class="numarqo-sub">NUMARQO ECOSYSTEM</span></div>
        </div>
    </header>

    <div class="calc-container">
        <!-- Professional Modal -->
        <div id="gameModal" class="modal hidden">
            <div class="modal-card">
                <div class="modal-icon">✨</div>
                <div class="modal-title" id="modalTitle">Notice</div>
                <div class="modal-msg" id="modalMsg">Operation successful.</div>
                <button class="numarqo-btn" style="background:#2563EB; color:#FFF; width:100%; padding:10px; border-radius:10px; border:none; font-weight:700; cursor:pointer;" onclick="closeModal()">Got It</button>
            </div>
        </div>

        <div class="calc-header"><i class="fa-solid fa-calculator" style="color:#2563EB;"></i> Smart AI Calculator</div>
        <p class="calc-desc">Advanced calculation with step-by-step AI reasoning and scientific functions.</p>

        <!-- Mode Selector -->
        <div class="mode-pills">
            <button class="pill-btn active" id="btnBasic" onclick="switchMode('basic')">✨ Basic &amp; AI Solver</button>
            <button class="pill-btn" id="btnSci" onclick="switchMode('sci')">🔬 Scientific</button>
        </div>

        <div class="display-screen">
            <input type="text" id="calcInput" placeholder="0" readonly>
            <div id="calcResult"></div>
        </div>

        <!-- Keypad Basic (Default) -->
        <div class="keypad-grid" id="keypadBasic">
            <button class="calc-btn action" onclick="clearDisplay()">AC</button>
            <button class="calc-btn operator" onclick="appendValue('(')">(</button>
            <button class="calc-btn operator" onclick="appendValue(')')">)</button>
            <button class="calc-btn operator" onclick="appendValue('/')">÷</button>

            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn operator" onclick="appendValue('*')">×</button>

            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn operator" onclick="appendValue('-')">-</button>

            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn operator" onclick="appendValue('+')">+</button>

            <button class="calc-btn" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>
            <button class="calc-btn equals" onclick="calculateResult()">=</button>
        </div>

        <!-- Keypad Scientific (Hidden by default) -->
        <div class="keypad-grid hidden" id="keypadSci">
            <button class="calc-btn action" onclick="clearDisplay()">AC</button>
            <button class="calc-btn sci" onclick="appendFunction('Math.sin(')">sin</button>
            <button class="calc-btn sci" onclick="appendFunction('Math.cos(')">cos</button>
            <button class="calc-btn sci" onclick="appendFunction('Math.tan(')">tan</button>

            <button class="calc-btn sci" onclick="appendFunction('Math.sqrt(')">√</button>
            <button class="calc-btn sci" onclick="appendValue('**2')">x²</button>
            <button class="calc-btn sci" onclick="appendFunction('Math.log10(')">log</button>
            <button class="calc-btn operator" onclick="appendValue('/')">÷</button>

            <button class="calc-btn" onclick="appendValue('7')">7</button>
            <button class="calc-btn" onclick="appendValue('8')">8</button>
            <button class="calc-btn" onclick="appendValue('9')">9</button>
            <button class="calc-btn operator" onclick="appendValue('*')">×</button>

            <button class="calc-btn" onclick="appendValue('4')">4</button>
            <button class="calc-btn" onclick="appendValue('5')">5</button>
            <button class="calc-btn" onclick="appendValue('6')">6</button>
            <button class="calc-btn operator" onclick="appendValue('-')">-</button>

            <button class="calc-btn" onclick="appendValue('1')">1</button>
            <button class="calc-btn" onclick="appendValue('2')">2</button>
            <button class="calc-btn" onclick="appendValue('3')">3</button>
            <button class="calc-btn operator" onclick="appendValue('+')">+</button>

            <button class="calc-btn" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="appendValue('.')">.</button>
            <button class="calc-btn equals" onclick="calculateResult()">=</button>
        </div>

        <div class="ai-solution-box" id="aiBox">
            <strong>[AI Step-by-Step Explanation]</strong><br>
            <span id="aiText">Analyze arithmetic expression and evaluate operational sequence.</span>
        </div>
    </div>

    <script>
        let currentInput = '';

        function switchMode(mode) {
            const bBtn = document.getElementById('btnBasic');
            const sBtn = document.getElementById('btnSci');
            const bPad = document.getElementById('keypadBasic');
            const sPad = document.getElementById('keypadSci');

            if (mode === 'basic') {
                bBtn.classList.add('active');
                sBtn.classList.remove('active');
                bPad.classList.remove('hidden');
                sPad.classList.add('hidden');
            } else {
                sBtn.classList.add('active');
                bBtn.classList.remove('active');
                sPad.classList.remove('hidden');
                bPad.classList.add('hidden');
            }
        }

        function appendValue(val) {
            currentInput += val;
            document.getElementById('calcInput').value = currentInput;
        }

        function appendFunction(func) {
            currentInput += func;
            document.getElementById('calcInput').value = currentInput;
        }

        function clearDisplay() {
            currentInput = '';
            document.getElementById('calcInput').value = '';
            document.getElementById('calcResult').innerText = '';
            document.getElementById('aiBox').style.display = 'none';
        }

        function calculateResult() {
            if (!currentInput) return;
            try {
                let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                let res = eval(sanitized);
                document.getElementById('calcResult').innerText = `= ${res}`;
                
                const aiBox = document.getElementById('aiBox');
                document.getElementById('aiText').innerHTML = `• Evaluated expression: <code>${currentInput}</code><br>• Followed mathematical operator precedence.<br>• Computed Result: <strong>${res}</strong>`;
                aiBox.style.display = 'block';
            } catch (e) {
                document.getElementById('calcResult').innerText = 'Error';
                showModal("Calculation Error", "Please verify the mathematical expression format.");
            }
        }

        function showModal(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('gameModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('gameModal').classList.add('hidden');
        }
    </script>
</body>
</html>
