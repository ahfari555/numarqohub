<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Tip & Split Calculator Pro - NUMARQO</title>
    <meta name="theme-color" content="#0B1F44">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: radial-gradient(circle at center, #1e3a8a 0%, #0B1F44 100%); color: #0B1F44; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* Navbar Numarqo */
        .numarqo-navbar { width: 100%; background: rgba(11, 31, 68, 0.85); backdrop-filter: blur(12px); color: #FFFFFF; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 25px rgba(0,0,0,0.3); }
        .numarqo-logo-wrap { display: flex; align-items: center; gap: 14px; }
        .numarqo-emblem { width: 38px; height: 38px; background: #0B1F44; border-radius: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .n-bar-1 { position: absolute; width: 13px; height: 100%; background: #2563EB; left: 4px; transform: skewX(-15deg); }
        .n-bar-2 { position: absolute; width: 13px; height: 100%; background: #06B6D4; right: 4px; transform: skewX(-15deg); }
        .numarqo-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
        .numarqo-sub { font-size: 0.65rem; font-weight: 700; color: #06B6D4; letter-spacing: 0.15em; text-transform: uppercase; }

        /* Container Pro */
        .calc-container { max-width: 440px; width: 92%; margin: 24px auto; padding: 24px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); position: relative; border: 1px solid rgba(255,255,255,0.6); text-align: left; }
        .calc-header { font-size: 1.3rem; font-weight: 800; color: #0B1F44; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .calc-desc { font-size: 0.82rem; color: #64748B; margin-bottom: 16px; line-height: 1.4; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .form-group label { font-size: 0.8rem; font-weight: 700; color: #0B1F44; display: flex; justify-content: space-between; }
        .form-input, .form-select { padding: 12px 14px; border-radius: 12px; border: 1px solid #CBD5E1; font-size: 0.9rem; background: #F8FAFC; color: #0B1F44; outline: none; transition: 0.2s; }
        .form-input:focus, .form-select:focus { border-color: #2563EB; background: #FFF; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        .tip-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
        .pill { padding: 10px 4px; border-radius: 10px; border: 1px solid #CBD5E1; background: #F8FAFC; color: #334155; font-weight: 700; font-size: 0.82rem; cursor: pointer; text-align: center; transition: 0.2s; }
        .pill.active { background: #2563EB; color: #FFF; border-color: #2563EB; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }

        .summary-card { background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%); border: 1px solid #BFDBFE; border-radius: 18px; padding: 16px; margin-top: 16px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: #1E40AF; margin-bottom: 8px; }
        .summary-row.total { font-size: 1.1rem; border-top: 1px solid #BFDBFE; padding-top: 10px; color: #0B1F44; }

        .numarqo-btn { padding: 12px 18px; background: #2563EB; color: #FFF; border: none; border-radius: 14px; font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: 0 6px 16px rgba(37,99,235,0.3); transition: 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; }
        .numarqo-btn:hover { background: #0B1F44; transform: translateY(-1px); }

        /* Professional Pastel Modal */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,31,68,0.65); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; border-radius: 28px; z-index: 20; animation: fadeIn 0.2s ease-out; }
        .modal-card { background: #ECFDF5; border: 2px solid #A7F3D0; border-radius: 24px; padding: 28px; width: 85%; max-width: 310px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-icon { font-size: 3rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.25rem; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
        .modal-msg { font-size: 0.85rem; color: #475569; margin-bottom: 18px; font-weight: 600; line-height: 1.4; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="numarqo-navbar">
        <div class="numarqo-logo-wrap">
            <div class="numarqo-emblem"><div class="n-bar-1"></div><div class="n-bar-2"></div></div>
            <div><span class="numarqo-title">US Tip &amp; Split Pro</span><span class="numarqo-sub">NUMARQO LIFESTYLE</span></div>
        </div>
    </header>

    <div class="calc-container">
        <!-- Professional Modal Popup -->
        <div id="gameModal" class="modal hidden">
            <div class="modal-card">
                <div class="modal-icon">✨</div>
                <div class="modal-title" id="modalTitle">Split Copied</div>
                <div class="modal-msg" id="modalMsg">Calculation summary successfully copied to clipboard.</div>
                <button class="numarqo-btn" style="margin-top:0;" onclick="closeModal()">Awesome</button>
            </div>
        </div>

        <div class="calc-header"><i class="fa-solid fa-receipt" style="color:#2563EB;"></i> US Tip &amp; Bill Splitter</div>
        <p class="calc-desc">Accurate restaurant tipping, tax inclusion, and group bill splitting for US standards.</p>

        <div class="form-group">
            <label>Bill Subtotal ($)</label>
            <input type="number" id="billAmount" class="form-input" placeholder="0.00" oninput="calculateTip()">
        </div>

        <div class="form-group">
            <label>US State Sales Tax</label>
            <select id="taxRate" class="form-select" onchange="calculateTip()">
                <option value="0">No Tax / Custom (0%)</option>
                <option value="7.25">California (7.25%)</option>
                <option value="8.875">New York (8.875%)</option>
                <option value="6.25">Texas (6.25%)</option>
                <option value="6.0">Florida (6.0%)</option>
                <option value="4.0">Illinois (4.0%)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Tip Percentage <span id="tipLabel" style="color:#2563EB;">18%</span></label>
            <div class="tip-pills">
                <button class="pill" onclick="setTip(15, this)">15%</button>
                <button class="pill active" onclick="setTip(18, this)">18%</button>
                <button class="pill" onclick="setTip(20, this)">20%</button>
                <button class="pill" onclick="setTip(25, this)">25%</button>
            </div>
            <input type="number" id="customTip" class="form-input" placeholder="Custom tip %" style="margin-top:6px;" oninput="setCustomTip(this)">
        </div>

        <div class="form-group">
            <label>Split Among People</label>
            <input type="number" id="splitCount" class="form-input" value="1" min="1" oninput="calculateTip()">
        </div>

        <div class="summary-card">
            <div class="summary-row"><span>Sales Tax:</span> <span id="taxResult">$0.00</span></div>
            <div class="summary-row"><span>Tip Amount:</span> <span id="tipResult">$0.00</span></div>
            <div class="summary-row"><span>Total Bill:</span> <span id="totalResult">$0.00</span></div>
            <div class="summary-row total"><span>Per Person:</span> <span id="perPersonResult">$0.00</span></div>
        </div>

        <button class="numarqo-btn" onclick="copySummary()"><i class="fa-solid fa-copy"></i> Copy Summary</button>
    </div>

    <script>
        let currentTip = 18;

        function setTip(val, btn) {
            currentTip = val;
            document.getElementById('customTip').value = '';
            document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tipLabel').innerText = `${val}%`;
            calculateTip();
        }

        function setCustomTip(input) {
            let val = parseFloat(input.value);
            if (!isNaN(val)) {
                currentTip = val;
                document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
                document.getElementById('tipLabel').innerText = `${val}%`;
                calculateTip();
            }
        }

        function calculateTip() {
            let bill = parseFloat(document.getElementById('billAmount').value) || 0;
            let taxPct = parseFloat(document.getElementById('taxRate').value) || 0;
            let split = parseInt(document.getElementById('splitCount').value) || 1;

            let taxAmt = bill * (taxPct / 100);
            let billWithTax = bill + taxAmt;
            let tipAmt = bill * (currentTip / 100); // Tip biasanya dihitung dari subtotal sebelum pajak di AS
            let total = billWithTax + tipAmt;
            let perPerson = total / split;

            document.getElementById('taxResult').innerText = `$${taxAmt.toFixed(2)}`;
            document.getElementById('tipResult').innerText = `$${tipAmt.toFixed(2)}`;
            document.getElementById('totalResult').innerText = `$${total.toFixed(2)}`;
            document.getElementById('perPersonResult').innerText = `$${perPerson.toFixed(2)}`;
        }

        function copySummary() {
            const perPerson = document.getElementById('perPersonResult').innerText;
            const total = document.getElementById('totalResult').innerText;
            showModal("Summary Copied", `Total Bill: ${total} | Each Person Pays: ${perPerson}`);
        }

        function showModal(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('gameModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('gameModal').classList.add('hidden');
        }
    </script>
</body>
</html>
