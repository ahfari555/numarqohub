<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Utility Pro - NUMARQO ECOSYSTEM</title>
    <meta name="theme-color" content="#0B1F44">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: radial-gradient(circle at center, #1e3a8a 0%, #0B1F44 100%); color: #0B1F44; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* Navbar Numarqo */
        .numarqo-navbar { width: 100%; background: rgba(11, 31, 68, 0.85); backdrop-filter: blur(12px); color: #FFFFFF; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 25px rgba(0,0,0,0.3); }
        .numarqo-logo-wrap { display: flex; align-items: center; gap: 14px; }
        .numarqo-emblem { width: 38px; height: 38px; background: #0B1F44; border-radius: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(37,99,235,0.5); }
        .n-bar-1 { position: absolute; width: 13px; height: 100%; background: #2563EB; left: 4px; transform: skewX(-15deg); }
        .n-bar-2 { position: absolute; width: 13px; height: 100%; background: #06B6D4; right: 4px; transform: skewX(-15deg); }
        .numarqo-title { font-size: 1.15rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; }
        .numarqo-sub { font-size: 0.65rem; font-weight: 700; color: #06B6D4; letter-spacing: 0.15em; text-transform: uppercase; }

        /* App Container Pro */
        .app-container { max-width: 500px; width: 92%; margin: 24px auto; padding: 24px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); position: relative; border: 1px solid rgba(255,255,255,0.6); }
        .app-header { font-size: 1.35rem; font-weight: 800; color: #0B1F44; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .app-desc { font-size: 0.82rem; color: #64748B; margin-bottom: 16px; line-height: 1.4; }

        /* Kategori Selector */
        .category-pills { display: flex; gap: 8px; margin-bottom: 16px; }
        .pill-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #CBD5E1; background: #F8FAFC; color: #64748B; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
        .pill-btn.active { background: #2563EB; color: #FFF; border-color: #2563EB; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; text-align: left; }
        .form-group label { font-size: 0.8rem; font-weight: 700; color: #0B1F44; }
        .form-input { padding: 12px 14px; border-radius: 12px; border: 1px solid #CBD5E1; font-size: 0.88rem; background: #F8FAFC; color: #0B1F44; outline: none; }
        .form-input:focus { border-color: #2563EB; background: #FFF; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        /* Progress Bar Animation Container */
        .progress-container { background: #E2E8F0; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin-bottom: 14px; display: none; }
        .progress-bar { background: linear-gradient(90deg, #2563EB, #06B6D4); height: 100%; width: 0%; transition: width 0.1s linear; }

        .numarqo-btn { padding: 12px 20px; background: #2563EB; color: #FFF; border: none; border-radius: 14px; font-weight: 700; font-size: 0.88rem; cursor: pointer; box-shadow: 0 6px 16px rgba(37,99,235,0.3); transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .numarqo-btn:hover { background: #0B1F44; transform: translateY(-2px); }

        /* Library List */
        .library-header { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; font-size: 0.85rem; font-weight: 800; color: #0B1F44; text-align: left; }
        .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; text-align: left; }
        .history-card { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px; font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.2s ease-out; }
        .card-actions { display: flex; gap: 8px; }
        .action-icon-btn { background: none; border: none; cursor: pointer; font-size: 0.9rem; color: #64748B; transition: 0.2s; }
        .action-icon-btn:hover { color: #2563EB; }
        .action-icon-btn.delete:hover { color: #EF4444; }

        /* Professional Pastel Modal */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,31,68,0.65); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; border-radius: 28px; z-index: 20; animation: fadeIn 0.2s ease-out; }
        .modal-card { background: #ECFDF5; border: 2px solid #A7F3D0; border-radius: 24px; padding: 28px; width: 85%; max-width: 310px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-icon { font-size: 3rem; margin-bottom: 8px; }
        .modal-title { font-size: 1.25rem; font-weight: 800; color: #1E293B; margin-bottom: 6px; }
        .modal-msg { font-size: 0.85rem; color: #475569; margin-bottom: 18px; font-weight: 600; line-height: 1.4; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header class="numarqo-navbar">
        <div class="numarqo-logo-wrap">
            <div class="numarqo-emblem"><div class="n-bar-1"></div><div class="n-bar-2"></div></div>
            <div><span class="numarqo-title">Media Utility Pro</span><span class="numarqo-sub">NUMARQO ECOSYSTEM</span></div>
        </div>
    </header>

    <div class="app-container">
        <div id="gameModal" class="modal hidden">
            <div class="modal-card">
                <div class="modal-icon" id="modalIcon">✨</div>
                <div class="modal-title" id="modalTitle">Download Complete</div>
                <div class="modal-msg" id="modalMsg">Media asset successfully fetched and cached locally.</div>
                <button class="numarqo-btn" onclick="closeModal()">Continue</button>
            </div>
        </div>

        <div class="app-header"><i class="fa-solid fa-cloud-arrow-down" style="color:#2563EB;"></i> Public Media Downloader</div>
        <p class="app-desc">Fetch and manage public records, creative commons files, and educational video assets.</p>

        <!-- Kategori Pilihan -->
        <div class="category-pills">
            <button class="pill-btn active" onclick="setCategory('Video', this)">🎬 Public Video</button>
            <button class="pill-btn" onclick="setCategory('Audio', this)">🎵 Public Audio</button>
            <button class="pill-btn" onclick="setCategory('Document', this)">📄 Public Doc</button>
        </div>

        <div class="form-group">
            <label id="inputLabel">Public Video URL / Source Link</label>
            <input type="text" id="mediaUrl" class="form-input" placeholder="https://archive.org/details/sample-video">
        </div>

        <!-- Progress Bar Simpan -->
        <div class="progress-container" id="progressBox">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button class="numarqo-btn" id="downloadBtn" onclick="startDownload()"><i class="fa-solid fa-download"></i> Fetch &amp; Save Asset</button>

        <div class="library-header">
            <span>Cached Local Library</span>
            <span id="itemCount" style="font-size:0.75rem; color:#64748B;">0 items</span>
        </div>
        
        <div class="history-list" id="historyList">
            <p style="color:#94A3B8; font-size:0.8rem; text-align:center; padding: 10px;">No downloaded files yet.</p>
        </div>
    </div>

    <script>
        let downloads = JSON.parse(localStorage.getItem('numarqo_media_lib')) || [];
        let currentCategory = 'Video';

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const label = document.getElementById('inputLabel');
            const input = document.getElementById('mediaUrl');
            if (cat === 'Video') {
                label.innerText = 'Public Video URL / Source Link';
                input.placeholder = 'https://archive.org/details/sample-video';
            } else if (cat === 'Audio') {
                label.innerText = 'Public Audio Stream URL';
                input.placeholder = 'https://freesound.org/sample-audio.mp3';
            } else {
                label.innerText = 'Public Document URL (PDF/TXT)';
                input.placeholder = 'https://gutenberg.org/files/sample.pdf';
            }
        }

        function startDownload() {
            const url = document.getElementById('mediaUrl').value.trim();
            if (!url) {
                showModal("URL Required", "Please enter a valid source link before downloading.", "warning");
                return;
            }

            const btn = document.getElementById('downloadBtn');
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');

            btn.disabled = true;
            progressBox.style.display = 'block';
            progressBar.style.width = '0%';

            let width = 0;
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    progressBox.style.display = 'none';
                    btn.disabled = false;

                    const fileName = url.split('/').pop() || `asset_${Date.now()}.${currentCategory === 'Video' ? 'mp4' : currentCategory === 'Audio' ? 'mp3' : 'pdf'}`;
                    downloads.unshift({ id: Date.now(), name: fileName, category: currentCategory, date: new Date().toLocaleTimeString() });
                    saveAndRender();
                    document.getElementById('mediaUrl').value = '';
                    showModal("Success", `Public ${currentCategory.toLowerCase()} asset successfully fetched and cached locally.`, "success");
                } else {
                    width += 15;
                    progressBar.style.width = width + '%';
                }
            }, 120);
        }

        function saveAndRender() {
            localStorage.setItem('numarqo_media_lib', JSON.stringify(downloads));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            document.getElementById('itemCount').innerText = `${downloads.length} items`;

            if (downloads.length === 0) {
                list.innerHTML = '<p style="color:#94A3B8; font-size:0.8rem; text-align:center; padding: 10px;">No downloaded files yet.</p>';
                return;
            }

            list.innerHTML = '';
            downloads.forEach(item => {
                const icon = item.category === 'Video' ? 'fa-file-video' : item.category === 'Audio' ? 'fa-file-audio' : 'fa-file-pdf';
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <span><i class="fa-solid ${icon}" style="color:#2563EB;"></i> <strong style="color:#1E293B;">${item.name}</strong> <span style="font-size:0.7rem; color:#64748B;">(${item.date})</span></span>
                    <div class="card-actions">
                        <button class="action-icon-btn" onclick="previewItem('${item.name}')" title="Preview"><i class="fa-solid fa-eye"></i></button>
                        <button class="action-icon-btn delete" onclick="deleteItem(${item.id})" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function previewItem(name) {
            showModal("Asset Preview", `Opening interactive preview for cached file: "${name}"`, "info");
        }

        function deleteItem(id) {
            downloads = downloads.filter(d => d.id !== id);
            saveAndRender();
        }

        function showModal(title, msg, type) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg;
            const modal = document.getElementById('gameModal');
            const card = modal.querySelector('.modal-card');
            
            if (type === 'success') {
                card.style.background = '#ECFDF5';
                card.style.borderColor = '#A7F3D0';
                document.getElementById('modalIcon').innerText = '✨';
            } else {
                card.style.background = '#FFFBEB';
                card.style.borderColor = '#FDE68A';
                document.getElementById('modalIcon').innerText = '💡';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('gameModal').classList.add('hidden');
        }

        renderHistory();
    </script>
</body>
</html>
